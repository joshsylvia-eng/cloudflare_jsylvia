<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Josh Sylvia - Principal Software Engineer & Technology Innovator</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Search JavaScript - Must load before navigation -->
    <script src="js/search-functions.js"></script>
    <script src="js/nav.js"></script>
    
    <!-- Navigation Component -->
    <div id="navigation-container"></div>

    <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <h1 class="page-title">Contact Us</h1>
                <p class="page-description">Get in touch with us! We'd love to hear from you about our tech projects and innovations.</p>
                
                <div class="contact-container">
                    <div class="contact-form-section">
                        <h2 class="section-title">Send us a Message</h2>
                        <p>Click the button below to open your email client and send a message directly.</p>
                        <a href="mailto:joshsylvia@gmail.com" class="submit-btn">Send Email</a>
                    </div>
                    
                    <div class="contact-info-section">
                        <h2 class="section-title">Contact Information</h2>
                        
                        <div class="contact-info-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Location: Laurel, MD</span>
                        </div>
                        
                        <div class="contact-info-item">
                            <i class="fas fa-clock"></i>
                            <span>Response time: Within 24 hours</span>
                        </div>
                        
                        <div class="map-container">
                            <iframe 
                                src="https://www.openstreetmap.org/export/embed.html?bbox=-77.0835%2C39.0995%2C-77.0635%2C39.1195&layer=mapnik&marker=39.1095%2C-77.0735"
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script>
            // Load shared navigation component
            async function loadNavigation() {
                try {
                    const response = await fetch('components/navigation.html');
                    const navigationHTML = await response.text();
                    document.getElementById('navigation-container').innerHTML = navigationHTML;
                    
                    // Set active page based on current URL
                    const currentPage = window.location.pathname;
                    if (currentPage === '/index.html' || currentPage === '/') {
                        document.querySelector('.nav-link[href="index.html"]')?.classList.add('active');
                        document.querySelector('.sidebar-link[href="index.html"]')?.classList.add('active');
                    } else if (currentPage === '/contact.html') {
                        document.querySelector('.nav-link[href="contact.html"]')?.classList.add('active');
                        document.querySelector('.sidebar-link[href="contact.html"]')?.classList.add('active');
                    }
                } catch (error) {
                    console.error('Failed to load navigation:', error);
                }
            }

            // Load navigation when page loads
            document.addEventListener('DOMContentLoaded', loadNavigation);
        </script>
    </body>
</html>
